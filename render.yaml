# Blueprint de Render: backend API (Go + scraper Python embebido) + frontend estático.
# Aplicar desde el dashboard con "New + Blueprint" apuntando a este repositorio.
# Base de datos: Neon (PostgreSQL + PostGIS). El schema se crea solo al arrancar
# el backend (db.go es idempotente), así que la base arranca vacía.
services:
  # Backend API. La imagen Go nativa de Render no trae Python, así que este
  # servicio se buildea desde un Dockerfile (backend/Dockerfile) que empaqueta el
  # binario Go + Python 3 + el scraper (scraper/). El scraper NO se expone por
  # URL: lo dispara el backend cada 24 h (SCRAPER_INTERVALO_MINUTOS=1440).
  - type: web
    name: bassonicos-backend
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: SCRAPER_INTERVALO_MINUTOS
        value: 1440
      - key: KEEP_ALIVE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SITIO_WEB
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:soporte@bassonicos.com

  # Frontend estático (React/Vite). VITE_API_URL debe apuntar al URL público
  # del backend (se resuelve en build time): https://<backend>.onrender.com
  - type: web
    name: bassonicos-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    # SPA fallback: cualquier ruta que no matchee un archivo real (p. ej. /ayuda,
    # /login) se reescribe a /index.html para que el router del cliente la maneje.
    # Render no aplica la regla si el archivo existe, así los assets no se tocan.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false